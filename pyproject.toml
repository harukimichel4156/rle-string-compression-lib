[project]
name = "rle-string-compression-lib"
version = "0.1.0"
description = "Run-length encoder/decoder for strings that escapes digit runs to avoid ambiguity during decompression."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
